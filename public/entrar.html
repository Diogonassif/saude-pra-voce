<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Saúde Pra Você</title>
<meta name="theme-color" content="#0E2B36">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lib/dc.css">
<style>
body { background: radial-gradient(900px 700px at 70% 10%, #17495A 0%, #0E2B36 60%, #08202A 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.box { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
.box .brand { justify-content: center; font-size: 30px; }
.box .brand .mk svg { width: 40px; height: 40px; }
.lead { color: #C5DADD; text-align: center; font-size: 15px; }
.papel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.papel .opt { align-items: flex-start; min-height: 130px; }
.papel .opt svg { margin-bottom: 6px; }
#vidBox video { width: 100%; max-width: 360px; align-self: center; aspect-ratio: 9 / 16; border-radius: 18px; background: #0E2B36; }
#vidBox .seg2 { display: flex; gap: 8px; } #vidBox .seg2 button { flex: 1; }
</style>
</head>
<body>
<main class="box">
  <a class="brand" href="/" id="marca"></a>
  <p class="lead" id="lead">Cuidado de confiança, contratado com segurança.</p>

  <section class="card col" id="login">
    <h2 id="tit">Entrar</h2>
    <form id="form" class="col">
      <label class="f hide" id="nomeL">Seu nome completo<input class="in" id="nome" autocomplete="name" maxlength="80"></label>
      <label class="f"><span id="telT">Celular ou e-mail</span><input class="in" id="tel" type="text" autocomplete="username" placeholder="(16) 99999-0000 ou seu@email.com" required></label>
      <label class="f hide" id="emailL">E-mail (opcional)<small>para entrar também com o e-mail e receber avisos</small><input class="in" id="email" type="email" autocomplete="email" maxlength="120" placeholder="seu@email.com"></label>
      <label class="f">Senha<small id="senhaDica" class="hide">mínimo de 6 caracteres</small><input class="in" id="senha" type="password" autocomplete="current-password" minlength="6" required></label>
      <label class="f hide" id="senha2L">Repita a senha<input class="in" id="senha2" type="password" autocomplete="new-password" minlength="6"></label>
      <button class="btn btn-block" id="go" type="submit">Entrar</button>
    </form>
    <p class="small mute" style="text-align:center"><span id="tx1">Primeira vez aqui?</span> <button class="link" type="button" id="troca">Criar conta</button></p>
    <p class="small mute" style="text-align:center"><button class="link" type="button" id="esqueci">Esqueci a senha</button></p>
    <p class="tiny mute" style="text-align:center">Ao continuar você aceita os <a href="/termos.html">Termos de uso</a> e a <a href="/privacidade.html">Política de privacidade</a>.</p>
  </section>

  <section class="card col" id="vidBox" aria-label="Vídeo: como funciona"></section>
  <div id="instBox" data-instalar="geral"></div>

  <section class="card col hide" id="papelBox">
    <div><h2>Como você vai usar a Saúde Pra Você?</h2><p class="mute small">Escolha uma vez. Para usar dos dois jeitos, crie outra conta com outro celular.</p></div>
    <div class="papel">
      <button class="opt" type="button" data-p="cliente"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#17705F" stroke-width="2" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><b>Preciso de um profissional</b><span>Para mim ou para alguém da família.</span></button>
      <button class="opt" type="button" data-p="pro"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#17705F" stroke-width="2" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6M12 15v4M10 17h4"/></svg><b>Sou profissional de saúde</b><span>Enfermagem, cuidador ou acompanhante.</span></button>
    </div>
    <button class="btn btn-block" id="continuar" disabled>Continuar</button>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/lib/config.js"></script>
<script src="/lib/dc.js"></script>
<script src="/lib/instalar.js"></script>
<script>
(async function () {
  const { $, $$, sb } = DC;
  $('#marca').innerHTML = DC.marca();
  const qs = new URLSearchParams(location.search);
  const volta = qs.get('volta');
  let criar = false, papel = null;
  // de qual link a pessoa veio: profissional ou contratante
  let como = qs.get('como');
  try { if (como === 'pro' || como === 'cliente') localStorage.setItem('dc_como', como); else como = localStorage.getItem('dc_como'); } catch (e) {}
  if (como === 'pro') { $('#lead').textContent = 'Entre para montar seu perfil, definir seu valor e receber pedidos.'; $('#marca').href = '/profissional.html'; }
  if (como === 'cliente') { $('#lead').textContent = 'Entre para escolher o profissional e contratar com segurança.'; $('#marca').href = '/contratante.html'; }
  const vai = (role, me) => location.replace(volta && volta.startsWith('/') && !volta.startsWith('//') ? volta : DC.home(role, me));

  async function depois() {
    const s = await DC.session(); if (!s) return;
    let me = null; try { me = await DC.api('/api/conta', null, 'GET'); } catch (e) {}
    if (me && me.role) {
      const pedido = $('#email').value.trim().toLowerCase();
      if (criar && pedido && me.email !== pedido) { DC.toast('Conta criada. Esse e-mail já está em outra conta, então entre pelo celular.', true); await new Promise((r) => setTimeout(r, 2500)); }
      return vai(me.role, me);
    }
    $('#login').classList.add('hide'); $('#papelBox').classList.remove('hide');
    $('#lead').textContent = 'Bem-vindo(a), ' + ((s.user.user_metadata && s.user.user_metadata.full_name) || '').split(' ')[0] + '.';
    const pre = $(`[data-p="${como}"]`); if (pre) pre.click();
  }
  depois();

  // vídeo "como funciona" conforme o perfil (link de profissional ou de contratante)
  const VID = { pro: ['/videos/video-profissional.mp4', '/videos/poster-pro.jpg', 'Veja como funciona para profissionais', 'Você define seu valor, encontra famílias e recebe pelo app.'],
    cliente: ['/videos/video-contratante.mp4', '/videos/poster-cli.jpg', 'Veja como funciona para famílias', 'Escolha, contrate do seu jeito e pague com segurança.'] };
  const mostraVideo = (k) => {
    const v = VID[k];
    $('#vidBox').innerHTML = `${como ? '' : `<div class="seg2"><button type="button" class="btn btn-sm ${k === 'cliente' ? '' : 'btn-ghost'}" data-v="cliente">Quero contratar</button><button type="button" class="btn btn-sm ${k === 'pro' ? '' : 'btn-ghost'}" data-v="pro">Sou profissional</button></div>`}
      <div><h2 style="font-size:19px">${v[2]}</h2><p class="small mute">${v[3]} · cerca de 1min30</p></div>
      <video src="${v[0]}" poster="${v[1]}" controls playsinline preload="none"></video>`;
    $$('#vidBox [data-v]').forEach((b) => (b.onclick = () => mostraVideo(b.dataset.v)));
  };
  mostraVideo(como === 'pro' ? 'pro' : 'cliente');
  if (como) $('#instBox').dataset.instalar = como;

  const modo = (c) => {
    criar = c;
    ['#nomeL', '#senha2L', '#senhaDica', '#emailL'].forEach((x) => $(x).classList.toggle('hide', !criar));
    $('#telT').textContent = criar ? 'Celular com DDD' : 'Celular ou e-mail';
    $('#tel').type = criar ? 'tel' : 'text'; $('#tel').inputMode = criar ? 'tel' : 'text';
    $('#tel').placeholder = criar ? '(16) 99999-0000' : '(16) 99999-0000 ou seu@email.com';
    $('#tel').autocomplete = criar ? 'tel' : 'username';
    $('#tit').textContent = criar ? 'Criar conta' : 'Entrar';
    $('#go').textContent = criar ? 'Criar conta' : 'Entrar';
    $('#tx1').textContent = criar ? 'Já tem conta?' : 'Primeira vez aqui?';
    $('#troca').textContent = criar ? 'Entrar' : 'Criar conta';
    $('#senha').autocomplete = criar ? 'new-password' : 'current-password';
  };
  $('#troca').onclick = () => modo(!criar);
  if (qs.get('criar')) modo(true);
  $('#tel').oninput = (e) => { if (/[@a-z]/i.test(e.target.value)) return; const d = e.target.value.replace(/\D/g, '').slice(0, 11); e.target.value = d.length > 6 ? `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d; };

  $('#esqueci').onclick = () => {
    const wa = DC.cfg && DC.cfg.central_whatsapp ? DC.wa(DC.cfg.central_whatsapp, 'Olá! Esqueci minha senha da Saúde Pra Você. Meu celular é ' + $('#tel').value) : null;
    const m = DC.modal(`<h2>Esqueci a senha</h2>
      <p class="small">Digite o celular ou o e-mail da sua conta. Mandamos um link para o <b>e-mail cadastrado</b> e você cria uma senha nova sozinho, na hora.</p>
      <label class="f">Celular ou e-mail<input class="in" id="rcLogin" autocomplete="username" value="${DC.esc($('#tel').value)}" placeholder="(16) 99999-0000 ou seu@email.com"></label>
      <div id="rcMsg"></div>
      <div class="acts"><button class="btn btn-ghost" data-close>Fechar</button><button class="btn" id="rcOk">Enviar link por e-mail</button></div>
      <p class="tiny mute" id="rcAlt">Sua conta não tem e-mail cadastrado? ${wa ? `<a href="${DC.esc(wa)}" target="_blank" rel="noopener">Fale com a central pelo WhatsApp</a>` : 'Fale com a nossa central pelo WhatsApp'} e depois cadastre um e-mail em Conta.</p>`);
    $('#rcOk', m.el).onclick = () => DC.busy($('#rcOk', m.el), async () => {
      const login = $('#rcLogin', m.el).value.trim();
      if (!login) throw new Error('Digite o celular ou o e-mail');
      const r = await fetch('/api/recuperar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ acao: 'pedir', login }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { $('#rcMsg', m.el).innerHTML = `<div class="banner">${DC.esc(j.error || 'Não deu para enviar agora. Tente de novo.')}${wa ? ` <a class="btn btn-sm btn-green" style="margin-top:8px" href="${DC.esc(wa)}" target="_blank" rel="noopener">Falar com a central</a>` : ''}</div>`; return; }
      $('#rcMsg', m.el).innerHTML = `<div class="banner ok">📧 ${DC.esc(j.msg)}</div>`;
      $('#rcOk', m.el).textContent = 'Enviar de novo';
    });
  };

  // WhatsApp da central (lido sem login pela configuração pública não é possível; tenta e segue sem)
  sb.from('config').select('key,value').eq('key', 'central_whatsapp').then((r) => { DC.cfg = Object.fromEntries(((r && r.data) || []).map((x) => [x.key, x.value])); });

  $('#form').onsubmit = (e) => {
    e.preventDefault();
    DC.busy($('#go'), async () => {
      const campo = $('#tel').value.trim();
      if (!criar && campo.includes('@')) {
        const r = await fetch('/api/entrar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: campo, senha: $('#senha').value }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'E-mail ou senha incorretos');
        const { error } = await sb.auth.setSession({ access_token: j.access_token, refresh_token: j.refresh_token });
        if (error) throw error;
        return depois();
      }
      const tel = DC.tel(campo);
      if (!tel) throw new Error(criar ? 'Informe o celular com DDD' : 'Informe o celular com DDD ou o e-mail');
      const email = DC.emailTec(tel), password = $('#senha').value;
      if (criar) {
        const nome = $('#nome').value.trim();
        if (nome.split(/\s+/).length < 2) throw new Error('Informe nome e sobrenome');
        if (password.length < 6) throw new Error('A senha precisa ter ao menos 6 caracteres');
        if (password !== $('#senha2').value) throw new Error('As senhas não conferem');
        const contato = $('#email').value.trim().toLowerCase();
        if (contato && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(contato)) throw new Error('Confira o e-mail ou deixe em branco');
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: nome, phone: tel, contact_email: contato || undefined } } });
        if (error) throw new Error(/registered|exists/i.test(error.message) ? 'Este celular já tem conta. Toque em Entrar.' : error.message);
        if (!data.session) {
          const r = await sb.auth.signInWithPassword({ email, password });
          if (r.error) throw new Error('Conta criada. Entre com seu celular e senha.');
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw new Error(/Invalid/i.test(error.message) ? 'Celular ou senha incorretos' : error.message);
      }
      await depois();
    });
  };
  $$('[data-p]').forEach((b) => b.onclick = () => {
    papel = b.dataset.p;
    $$('[data-p]').forEach((x) => x.classList.toggle('on', x === b));
    $('#continuar').disabled = false;
  });
  $('#continuar').onclick = () => DC.busy($('#continuar'), async () => {
    const { error } = await sb.rpc('escolher_papel', { papel });
    if (error) throw error;
    location.replace(papel === 'pro' ? '/pro.html#perfil' : '/cliente.html');
  });
})();
</script>
</body>
</html>
